name: Velora Finder

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -U requests cryptography playwright
          python -m playwright install --with-deps chromium

      - name: Find creators
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: python finder.py

      - name: Save results
        if: always()
        run: |
          git config user.name "velora-bot"
          git config user.email "velora-bot@users.noreply.github.com"
          git add finder_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "finder results"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || true
          done
