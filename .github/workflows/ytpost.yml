name: Velora Studio (YouTube)

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "auto / scan / upload_now / upload_video / retry / skip"
        required: false
        default: "auto"
      account:
        required: false
        default: ""
      video:
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ytpost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -U yt-dlp requests cryptography

      - name: Run engine
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          ACTION: ${{ inputs.action || 'auto' }}
          ACCOUNT: ${{ inputs.account }}
          VIDEO: ${{ inputs.video }}
        run: python ytpost.py

      - name: Save state
        if: always()
        run: |
          git config user.name "velora-bot"
          git config user.email "velora-bot@users.noreply.github.com"
          git add yt_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "yt state update"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || true
          done
